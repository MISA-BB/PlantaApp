spring.application.name=plantasbackend
server.port=8080

# Conexión a MySQL (crea la base de datos 'plantasdb' automáticamente si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/plantasdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Límite para subir fotografías desde Android
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# API Key de Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.8-flash

#${GEMINI_API_KEY}